name: Release checks
on:
  pull_request:
  push:
    branches: [fix/release-readiness-athlete-coach]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci && npm run build
        working-directory: website
      - run: docker run -d --name aether-release-test -e POSTGRES_PASSWORD=isolated-test-only postgres:17-alpine
      - run: |
          for attempt in $(seq 1 30); do
            if docker exec aether-release-test pg_isready -U postgres; then break; fi
            sleep 1
          done
          npm run test:database
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release:browser
        env:
          PLAYWRIGHT_USE_BUNDLED_CHROMIUM: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
